<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night - Tickets </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-dark">


    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-dark" href="index.html"> Movie Night</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link active fw-semibold" href="tickets.html">Tickets</a></li>
                        <li class="nav-item"><a class="nav-link" href="contactus.html">Contact Us</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main style="margin-top: 100px;" class="container py-4">
        
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="text-center mb-4">
                    <h1 class="fw-bold">Book Your Tickets</h1>
                    <p class="text-muted">Fill out the form below to reserve your seats for our upcoming screenings.</p>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 bg-light">
                    <form id="ticketForm">
                        
                    
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control rounded-3" id="fullName" placeholder="Enter your full name" required>
                        </div>

                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control rounded-3" id="email" placeholder="name@example.com" required>
                        </div>

                        
                        <div class="mb-3">
                            <label for="movieSelect" class="form-label fw-semibold">Select Movie</label>
                            <select class="form-select rounded-3" id="movieSelect" required>
                                <option value="" selected disabled>Choose a movie...</option>
                                <option value="jumanji">Jumanji</option>
                                <option value="thebfg">The BFG</option>
                                <option value="abuglife">A Bug's Life</option>
                                <option value="nightmare">The Nightmare Before Christmas</option>
                            </select>
                        </div>

                        
                        <div class="mb-4">
                            <label for="ticketCount" class="form-label fw-semibold">Number of Tickets</label>
                            <input type="number" class="form-control rounded-3" id="ticketCount" min="1" max="10" value="1" required>
                        </div>

                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark rounded-pill py-2 shadow-sm">Confirm Reservation</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    </main>


    <footer class="bg-white text-dark text-center py-4 border-top mt-5">
        <div class="container">
            <p class="mb-0 text-muted">&copy; 2026 Movie Night. All rights reserved.</p>
        </div>
    </footer>

    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
